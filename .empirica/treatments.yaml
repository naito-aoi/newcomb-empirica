factors:
  - desc: playerCount determines the number of Players are in a Game.
    name: playerCount
    values:
      - value: 1
  - desc: Type of allocator used in the game.
    name: allocatorType
    values:
      - value: random
      - value: silentAI
      - value: generativeAI
      - value: silentHuman
      - value: none
  - desc: Type of predictor used in the game.
    name: isAI
    values:
      - value: false
      - value: true
  - desc:
    name: isInteractive
    values:
      - value: false
      - value: true
  - desc: Number of rounds in the game.
    name: nRound
    values:
      - value: 1
      - value: 3
      - value: 5
  - desc: AI's prediction
    name: aiPrediction
    values:
      - value: 1box
      - value: 2box
  - desc: Who predicts the participant's choice (exp4). If unset, derived from isAI (AI / random generator).
    name: predictorType
    values:
      - value: AI
      - value: human
      - value: none
  - desc: What the tutorial says about the predictor's reliability (exp4). reliable = high reliability stated explicitly; agnostic = nothing said.
    name: reliability
    values:
      - value: reliable
      - value: agnostic
  - desc: If true, the tutorial and task state that the money in the boxes is not actually paid (exp4).
    name: isHypothetical
    values:
      - value: false
      - value: true
  - desc: If true, the result (feedback) stage is skipped and Box B's contents are never revealed (exp4).
    name: skipResult
    values:
      - value: false
      - value: true
  - desc: If true, the trait surveys (SOEP, risk, ideology, determinism) are left out of the exit survey; the AI literacy scale is kept (exp4).
    name: skipTraitSurveys
    values:
      - value: false
      - value: true
treatments:
  - desc: "exp1-random"
    factors:
      playerCount: 1
      allocatorType: random
      isAI: false
      isInteractive: false
      nRound: 1
      aiPrediction: 1box
    name: exp1-random
  - desc: "exp1-silentAI"
    factors:
      playerCount: 1
      allocatorType: silentAI
      isAI: true
      isInteractive: false
      nRound: 1
      aiPrediction: 1box
    name: exp1-silentAI
  - desc: "exp2-random"
    factors:
      playerCount: 1
      allocatorType: random
      isAI: false
      isInteractive: false
      nRound: 1
      aiPrediction: 1box
    name: exp2-random
  - desc: "exp2-interactiveRandom"
    factors:
      playerCount: 1
      allocatorType: random
      isAI: false
      isInteractive: true
      nRound: 1
      aiPrediction: 1box
    name: exp2-interactiveRandom
  - desc: "exp2-silentAI"
    factors:
      playerCount: 1
      allocatorType: silentAI
      isAI: true
      isInteractive: false
      nRound: 1
      aiPrediction: 1box
    name: exp2-silentAI
  - desc: "exp2-generativeAI"
    factors:
      playerCount: 1
      allocatorType: generativeAI
      isAI: true
      isInteractive: true
      nRound: 1
      aiPrediction: 1box
    name: exp2-generativeAI
  - desc: "exp3-1box"
    factors:
      playerCount: 1
      allocatorType: silentAI
      isAI: true
      isInteractive: false
      nRound: 5
      aiPrediction: 1box
    name: exp3-1box
  - desc: "exp3-2box"
    factors:
      playerCount: 1
      allocatorType: silentAI
      isAI: true
      isInteractive: false
      nRound: 5
      aiPrediction: 2box
    name: exp3-2box
  - desc: "exp4-reliableAI"
    factors:
      playerCount: 1
      allocatorType: silentAI
      isAI: true
      isInteractive: false
      nRound: 1
      aiPrediction: 1box
      predictorType: AI
      reliability: reliable
      isHypothetical: true
      skipResult: true
      skipTraitSurveys: true
    name: exp4-reliableAI
  - desc: "exp4-reliableHuman"
    factors:
      playerCount: 1
      allocatorType: silentHuman
      isAI: false
      isInteractive: false
      nRound: 1
      aiPrediction: 1box
      predictorType: human
      reliability: reliable
      isHypothetical: true
      skipResult: true
      skipTraitSurveys: true
    name: exp4-reliableHuman
  - desc: "exp4-agnosticAI"
    factors:
      playerCount: 1
      allocatorType: silentAI
      isAI: true
      isInteractive: false
      nRound: 1
      aiPrediction: 1box
      predictorType: AI
      reliability: agnostic
      isHypothetical: true
      skipResult: true
      skipTraitSurveys: true
    name: exp4-agnosticAI
  - desc: "exp4-agnosticHuman"
    factors:
      playerCount: 1
      allocatorType: silentHuman
      isAI: false
      isInteractive: false
      nRound: 1
      aiPrediction: 1box
      predictorType: human
      reliability: agnostic
      isHypothetical: true
      skipResult: true
      skipTraitSurveys: true
    name: exp4-agnosticHuman
  - desc: "exp4-noPrediction"
    factors:
      playerCount: 1
      allocatorType: none
      isAI: false
      isInteractive: false
      nRound: 1
      aiPrediction: 1box
      predictorType: none
      isHypothetical: true
      skipResult: true
      skipTraitSurveys: true
    name: exp4-noPrediction
